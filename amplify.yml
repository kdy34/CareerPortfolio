# AWS Amplify Hosting build spec (Next.js SSR, compute platform "WEB_COMPUTE").
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - node -v
        - npm install --no-audit --no-fund
    build:
      commands:
        # Amplify only exposes environment variables at build time; copy the ones
        # the server needs into .env.production so the SSR runtime can read them.
        - env | grep -E '^(NEXT_PUBLIC_|CONTACT_|RATE_LIMIT_TABLE)' | grep -v '^CONTACT_DEV_MOCK' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
